name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm lint

      - name: Compile TypeScript
        run: pnpm run compile

      - name: Run tests
        run: xvfb-run -a pnpm test

  publish:
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    needs: build-and-test # This job depends on 'build-and-test' passing
    # This job only runs when a tag (e.g., v1.0.0) is pushed
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Re-run checks for robustness before publishing
      - name: Run linter (pre-publish check)
        run: pnpm lint

      - name: Compile TypeScript (pre-publish check)
        run: pnpm run compile

      - name: Run tests (pre-publish check)
        run: xvfb-run -a pnpm test

      - name: Package extension
        run: pnpm run package

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm run publish
